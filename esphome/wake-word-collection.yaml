# Wake Word Collector: collection mode for an ESPHome voice satellite.
#
# Include it in the satellite's configuration (see README):
#
#   packages:
#     wake_word_collection:
#       url: https://github.com/ChristophBellmann/ha-wake-word-collector
#       ref: main
#       files:
#         - path: esphome/wake-word-collection.yaml
#           vars:
#             wake_word_device: kitchen-satellite
#             wake_word_url: http://homeassistant.local:8123/api/wake_word_collector/clips/hey_jarvis
#             wake_word_token: !secret wake_word_token
#             wake_word_command_entity: sensor.hey_jarvis_satellite_command
#             wake_word_microphone_id: i2s_mics
#             wake_word_va_id: va
#             wake_word_mww_id: mww
#             wake_word_media_player_id: external_media_player
#
# Requires http_request (id http_request_id), voice_assistant, micro_wake_word
# and a media player, as on the common voice satellites.
#
# In collection mode the voice assistant starts a new listening run after each clip. Every utterance
# is recorded from the satellite's own microphone (up to wake_word_max_duration,
# including the moment before listening started) and uploaded with its
# transcript to Home Assistant, which sorts it. Responses are not played back.
#
# Optional (wake_word_report_triggers: "true"): outside collection mode, the
# satellite also reports every wake word activation: the seconds before the
# detection go to Home Assistant as "trigger", where you mark them as the wake
# word or as a false alarm (card, or say "false alarm"). False alarms become
# training data the model learns to ignore. The audio is uploaded after the
# voice assistant finished, so answering is never delayed.
#
# Every satellite also counts its wake word detections (sensor "Wake word
# detections"); the loudspeaker test of the integration uses it.

defaults:
  wake_word_device: voice-satellite
  wake_word_url: http://homeassistant.local:8123/api/wake_word_collector/clips/wake_word
  wake_word_token: replace-me
  wake_word_command_entity: sensor.wake_word_satellite_command
  wake_word_microphone_id: i2s_mics
  wake_word_va_id: va
  wake_word_mww_id: mww
  wake_word_media_player_id: external_media_player
  wake_word_max_duration: 8s
  wake_word_manual_duration: 30s
  wake_word_report_triggers: "false"
  # ESPHome finds the component in esphome/components of the repository.
  wake_word_components: github://ChristophBellmann/ha-wake-word-collector@main

globals:
  - id: wake_word_collection_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wake_word_collection_arm_after_end
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wake_word_collection_stop_after_end
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wake_word_direct_recording
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wake_word_record_resume_detection
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wake_word_command_initialized
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wake_word_detection_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: wake_word_trigger_listen
        - component.update: wake_word_detections

external_components:
  - source: ${wake_word_components}
    components: [wakeword_recorder]

wakeword_recorder:
  id: wake_word_recorder
  microphone:
    microphone: ${wake_word_microphone_id}
    channels: 0
  http_request_id: http_request_id
  url: ${wake_word_url}
  token: ${wake_word_token}
  device: ${wake_word_device}
  max_duration: ${wake_word_max_duration}
  manual_duration: ${wake_word_manual_duration}

text_sensor:
  # "<start|stop>:<target>:<time>"; target "*" means: the satellite that is
  # running the current voice command (the one the user asked).
  - platform: homeassistant
    id: wake_word_collection_command
    entity_id: ${wake_word_command_entity}
    internal: true
    on_value:
      - lambda: |-
          // The first subscription value may be a command from before reboot.
          // Never start recording merely because HA replays its last state.
          if (!id(wake_word_command_initialized)) {
            id(wake_word_command_initialized) = true;
            return;
          }
          const size_t first = x.find(':');
          const size_t second = x.find(':', first == std::string::npos ? 0 : first + 1);
          if (first == std::string::npos || second == std::string::npos)
            return;
          const std::string action = x.substr(0, first);
          const std::string target = x.substr(first + 1, second - first - 1);
          const bool running = id(${wake_word_va_id}).is_running();
          const bool for_me = target == "${wake_word_device}" || (target == "*" && (running || id(wake_word_collection_active) || id(wake_word_collection_arm_after_end)));
          if (!for_me)
            return;
          if (action == "record") {
            if (id(wake_word_direct_recording))
              id(wake_word_direct_finish).execute();
            else
              id(wake_word_direct_record).execute();
          } else if (action == "start") {
            if (running && target == "*") {
              // Answer the request first, start collecting when this run ends.
              id(wake_word_collection_arm_after_end) = true;
            } else {
              id(wake_word_collection_active) = true;
              id(${wake_word_va_id}).set_media_player(nullptr);
              id(wake_word_collection_start_now).execute();
            }
          } else if (action == "stop") {
            id(wake_word_stop).execute();
          }

script:
  # GUI recording toggles start/save on the satellite, without Assist.
  # Long sessions are saved in bounded segments, preserving their beginning.
  - id: wake_word_direct_record
    mode: single
    then:
      - lambda: |-
          id(wake_word_direct_recording) = true;
          id(wake_word_collection_active) = true;
          id(wake_word_collection_arm_after_end) = false;
          id(wake_word_record_resume_detection) = id(${wake_word_mww_id}).is_running();
      - script.stop: wake_word_trigger_upload_later
      - voice_assistant.stop:
          id: ${wake_word_va_id}
      - wait_until:
          condition:
            lambda: return !id(${wake_word_va_id}).is_running();
          timeout: 5s
      - micro_wake_word.stop:
      - wakeword_recorder.upload: wake_word_recorder
      - wakeword_recorder.discard: wake_word_recorder
      - wakeword_recorder.hold: wake_word_recorder
      - lambda: id(wake_word_recorder).start_capture(true);
      - while:
          condition:
            lambda: return id(wake_word_direct_recording);
          then:
            - delay: ${wake_word_manual_duration}
            - if:
                condition:
                  lambda: return id(wake_word_direct_recording);
                then:
                  - wakeword_recorder.finish:
                      id: wake_word_recorder
                      transcript: ""
                      kind: manual
                  - wakeword_recorder.upload: wake_word_recorder
                  - lambda: id(wake_word_recorder).start_capture(true);
  - id: wake_word_direct_finish
    mode: single
    then:
      - script.stop: wake_word_direct_record
      - wakeword_recorder.finish:
          id: wake_word_recorder
          transcript: ""
          kind: manual
      - wakeword_recorder.upload: wake_word_recorder
      - wakeword_recorder.release: wake_word_recorder
      - lambda: |-
          id(wake_word_direct_recording) = false;
          id(wake_word_collection_active) = false;
          id(${wake_word_va_id}).set_media_player(id(${wake_word_media_player_id}));
          if (id(wake_word_record_resume_detection)) id(${wake_word_mww_id}).start();
          id(wake_word_record_resume_detection) = false;
      - script.execute: wake_word_trigger_listen
  - id: wake_word_stop
    then:
      - if:
          condition:
            lambda: return id(wake_word_direct_recording);
          then:
            - script.execute: wake_word_direct_finish
          else:
            - lambda: |-
                id(wake_word_collection_active) = false;
                id(wake_word_collection_arm_after_end) = false;
                id(wake_word_collection_stop_after_end) = false;
                id(${wake_word_va_id}).set_media_player(id(${wake_word_media_player_id}));
            - wakeword_recorder.discard: wake_word_recorder
            - script.execute: wake_word_collection_stop_now
            - script.execute: wake_word_trigger_listen
  # Keep a ring buffer of the last seconds while not collecting, for trigger reports.
  - id: wake_word_trigger_listen
    then:
      - if:
          condition:
            lambda: return ${wake_word_report_triggers} && !id(wake_word_collection_active);
          then:
            - wakeword_recorder.capture: wake_word_recorder
  # Upload a finished trigger report later if no voice assistant run does it.
  - id: wake_word_trigger_upload_later
    mode: restart
    then:
      - delay: 20s
      - wakeword_recorder.upload: wake_word_recorder
      - script.execute: wake_word_trigger_listen
  - id: wake_word_collection_start_now
    mode: restart
    then:
      - voice_assistant.stop:
          id: ${wake_word_va_id}
      - wait_until:
          condition:
            lambda: return !id(${wake_word_va_id}).is_running();
          timeout: 5s
      - if:
          condition:
            lambda: return id(wake_word_collection_active) && !id(${wake_word_va_id}).is_running();
          then:
            - micro_wake_word.stop:
            # A continuous run keeps voice_assistant.is_running true between
            # utterances; common satellite on_end handlers then wait forever.
            - voice_assistant.start:
                id: ${wake_word_va_id}
  - id: wake_word_collection_stop_now
    then:
      - script.stop: wake_word_collection_start_now
      - voice_assistant.stop:
          id: ${wake_word_va_id}

binary_sensor:
  - platform: template
    id: wake_word_collection_status
    name: Wake word collection
    entity_category: diagnostic
    lambda: return id(wake_word_collection_active);

button:
  - platform: template
    name: Start wake word collection
    entity_category: config
    on_press:
      - lambda: |-
          id(wake_word_collection_active) = true;
          id(${wake_word_va_id}).set_media_player(nullptr);
      - script.execute: wake_word_collection_start_now
  - platform: template
    name: Stop wake word collection
    entity_category: config
    on_press:
      - script.execute: wake_word_stop

sensor:
  - platform: template
    name: Wake word detections
    id: wake_word_detections
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: never
    lambda: return id(wake_word_detection_count);

micro_wake_word:
  id: ${wake_word_mww_id}
  on_wake_word_detected:
    - lambda: id(wake_word_detection_count) += 1;
    - component.update: wake_word_detections
    - if:
        condition:
          lambda: return ${wake_word_report_triggers} && !id(wake_word_collection_active);
        then:
          # Let the end of the wake word reach the buffer, then freeze it.
          - delay: 300ms
          - wakeword_recorder.finish:
              id: wake_word_recorder
              transcript: ""
              kind: trigger
          - script.execute: wake_word_trigger_upload_later

voice_assistant:
  id: ${wake_word_va_id}
  on_listening:
    - if:
        condition:
          lambda: return id(wake_word_collection_active) && !id(wake_word_direct_recording);
        then:
          - wakeword_recorder.capture: wake_word_recorder
  on_stt_end:
    - if:
        condition:
          lambda: return id(wake_word_collection_active) && !id(wake_word_direct_recording);
        then:
          - wakeword_recorder.finish:
              id: wake_word_recorder
              transcript: !lambda return x;
  on_error:
    - if:
        condition:
          lambda: return id(wake_word_collection_active) && !id(wake_word_direct_recording);
        then:
          - wakeword_recorder.discard: wake_word_recorder
  on_end:
    - if:
        condition:
          lambda: return id(wake_word_collection_arm_after_end);
        then:
          - lambda: |-
              id(wake_word_collection_arm_after_end) = false;
              id(wake_word_collection_active) = true;
              id(${wake_word_va_id}).set_media_player(nullptr);
          - micro_wake_word.stop:
    - if:
        condition:
          lambda: return id(wake_word_collection_active) && !id(wake_word_direct_recording);
        then:
          - wakeword_recorder.upload: wake_word_recorder
          # The media player's on_idle may re-arm micro_wake_word in the same
          # scheduler turn. Let it finish, then make collection authoritative.
          - delay: 250ms
          - micro_wake_word.stop:
          - if:
              condition:
                lambda: return id(wake_word_collection_active) && !id(wake_word_direct_recording);
              then:
                - voice_assistant.start:
                    id: ${wake_word_va_id}
    - if:
        condition:
          lambda: return !id(wake_word_collection_active) && !id(wake_word_direct_recording);
        then:
          - wakeword_recorder.upload: wake_word_recorder
          - script.stop: wake_word_trigger_upload_later
          - script.execute: wake_word_trigger_listen
          - lambda: id(${wake_word_va_id}).set_media_player(id(${wake_word_media_player_id}));
          - if:
              condition:
                lambda: return id(wake_word_collection_stop_after_end);
              then:
                - lambda: id(wake_word_collection_stop_after_end) = false;
                - voice_assistant.stop:
                    id: ${wake_word_va_id}
