start:
  fields:
    config_entry_id: &entry
      selector:
        config_entry:
          integration: wake_word_collector
    device: &device
      example: kitchen-satellite
      selector:
        text:
stop:
  fields:
    config_entry_id: *entry
    device: *device
review:
  fields:
    config_entry_id: *entry
    category: &category
      required: true
      selector:
        select:
          options: [candidates, needs_review, rejected_transcript, triggers, control, negatives]
    device: &clip_device
      required: true
      selector:
        text:
    filename: &filename
      required: true
      selector:
        text:
    decision:
      required: true
      selector:
        select:
          options: [accept, reject, negative]
    note:
      selector:
        text:
review_latest:
  fields:
    config_entry_id: *entry
    note:
      required: true
      selector:
        text:
    decision:
      default: note
      selector:
        select:
          options: [note, reject]
    device:
      selector:
        text:
trim:
  fields:
    config_entry_id: *entry
    category: *category
    device: *clip_device
    filename: *filename
    start_ms:
      required: true
      selector:
        number:
          min: 0
          max: 60000
          unit_of_measurement: ms
          mode: box
    end_ms:
      required: true
      selector:
        number:
          min: 0
          max: 60000
          unit_of_measurement: ms
          mode: box
    mode:
      default: keep
      selector:
        select:
          options: [keep, remove, extract]
review_latest_trigger:
  fields:
    config_entry_id: *entry
    decision:
      required: true
      selector:
        select:
          options: [accept, negative]
    device:
      selector:
        text:
start_training:
  fields:
    config_entry_id: *entry
    profile:
      example: recommended
      selector:
        text:
stop_training:
  fields:
    config_entry_id: *entry
speaker_test:
  fields:
    config_entry_id: *entry
    route:
      required: true
      example: speakers
      selector:
        text:
run_speaker_test:
  fields:
    config_entry_id: *entry
    device:
      example: kitchen-satellite
      selector:
        text:
    route:
      example: speakers
      selector:
        text:
    clips:
      default: 5
      selector:
        number:
          min: 1
          max: 20
    satellite:
      selector:
        entity:
          domain: assist_satellite
import:
  fields:
    config_entry_id: *entry
    folder:
      required: true
      example: /config/wake_word_import/earlier
      selector:
        text:
    category:
      required: true
      selector:
        select:
          options: [candidates, negatives]
    device:
      required: true
      example: earlier
      selector:
        text:
    note:
      selector:
        text:
